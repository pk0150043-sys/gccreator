[variables]
RAILPACK_PYTHON_PLAYWRIGHT_INSTALL = "1"

[phases.setup]
nixPkgs = ["playwright-driver.browsers", "glib", "nss", "nspr", "atk", "cups", "libdrm", "dbus", "libxkbcommon", "libX11", "mesa", "pango", "cairo", "alsa-lib"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install --with-deps chromium"
]

[start]
cmd = "python server.py"
